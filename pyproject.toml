[project]
name = "olympiad-commentator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "logfire[fastapi]>=5.1.0",
    "modal>=1.5.5",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[google,openai]>=2.46.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commentator"]
